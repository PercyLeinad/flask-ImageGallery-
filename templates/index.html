<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/static/favicon-32x32.png"
		/>

        <body>
            <div class="container">
                <button id="theme-toggle">Toggle Theme</button>
            </div>
        </body>

</head>
<body>
    <div class="wrapper">
        <div class="header">
            <a href="/"><img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img"></a>
            <center><h1>Image Gallery</h1></center>
        </div>

        <div class="main" id="foo">
            <!-- this is the main -->
        
        </div>


        <div class="pagination">  
            {% if page > 1 %}
                <a href="{{ url_for('index', page=page-1) }}">
                    <button id="btnPrevious">&larr; </button>
                </a>
            {% endif %}
            
            <span id="page">Page {{ page }} of {{ total_pages }}</span>
            <span id="curr_page">{{page}}</span>
        
            <!-- Loop to generate page numbers -->
            <div class="page-numbers">
                {% for p in range(1, total_pages + 1) %}
                    {% if p == page %}
                        <span class="current">{{ p }}</span>
                    {% else %}
                        <a href="{{ url_for('index', page=p) }}">{{ p }}</a>
                    {% endif %}
                {% endfor %}
            </div>
        
            {% if page < total_pages %}
                <a href="{{ url_for('index', page=page+1) }}">
                    <button id="btnNext"><span class="sr-only">Next</span>&rarr;</button>
                </a>
            {% endif %}
        </div>


        <div class="container">
            <div class="footer">
                <h5><strong><center>&copy;2024</strong></center></h5>
            </div>
        </div>
    </div>
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
